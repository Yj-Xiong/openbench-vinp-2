[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openbench-vinp-ospatialnet"
version = "0.1.0"
description = "VINP speech dereverberation Skill for OpenBench"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2,<2.4",
  "torchaudio>=2.2,<2.4",
  "numpy>=1.26,<2",
  "scipy>=1.11",
  "librosa>=0.10",
  "soundfile>=0.12",
  "PyYAML>=6.0",
  "toml>=0.10",
  "einops>=0.8",
  "mamba-ssm==2.1.0",
  "causal-conv1d==1.4.0",
]

[tool.setuptools]
packages = []
